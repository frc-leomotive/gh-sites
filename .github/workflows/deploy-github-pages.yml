name: Deploy websites to GitHub Pages

on:
  push:
    branches:
      - stable
      - preview
      - template
  workflow_dispatch:

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build stable, preview, and template websites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out stable branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: stable
          path: source/stable
          persist-credentials: false

      - name: Check out preview branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: preview
          path: source/preview
          persist-credentials: false

      - name: Check out template branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: template
          path: source/template
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: source/stable/.node-version
          cache: npm
          cache-dependency-path: |
            source/stable/package-lock.json
            source/preview/package-lock.json
            source/template/package-lock.json

      - name: Build stable website
        working-directory: source/stable
        run: |
          npm ci
          npm run prepare:content
          npm --workspace @gh-frc/framework run build -- --base /gh-sites/

      - name: Build preview website
        working-directory: source/preview
        run: |
          npm ci
          npm run prepare:content
          npm --workspace @gh-frc/framework run build -- --base /gh-sites/preview/

      - name: Build template website
        working-directory: source/template
        run: |
          npm ci
          npm run prepare:content
          npm run check:translations
          npm --workspace @site-template/framework run build -- --base /gh-sites/template/

      - name: Assemble combined website
        run: |
          mkdir -p site
          cp -r source/stable/framework/dist/. site/
          cp -r source/stable/framework/dist site/stable
          cp -r source/preview/framework/dist site/preview
          cp -r source/template/framework/dist site/template

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
